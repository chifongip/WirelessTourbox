name: Build GUI Config Tool

on:
  push:
    branches: [main]
    paths:
      - 'gui/**'
  pull_request:
    branches: [main]
    paths:
      - 'gui/**'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev libxxf86vm-dev

      - name: Build
        working-directory: gui
        run: CGO_ENABLED=1 go build -o wireless-tourbox-config .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireless-tourbox-config-linux
          path: gui/wireless-tourbox-config

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-mingw-w64-x86-64

      - name: Build
        working-directory: gui
        run: CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags "-H windowsgui" -o wireless-tourbox-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireless-tourbox-config-windows
          path: gui/wireless-tourbox-config.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            output: wireless-tourbox-config-mac
          - arch: arm64
            output: wireless-tourbox-config-mac-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: gui
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: go build -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireless-tourbox-config-${{ matrix.arch }}
          path: gui/${{ matrix.output }}
