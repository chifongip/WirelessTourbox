name: Build and Test Firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'test/**'
      - 'config_tool.py'
      - 'serial_protocol.py'
      - 'test_hardware.py'
      - 'test_serial_protocol.py'
      - 'platformio.ini'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'test/**'
      - 'config_tool.py'
      - 'serial_protocol.py'
      - 'test_hardware.py'
      - 'test_serial_protocol.py'
      - 'platformio.ini'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Test Python serial tools
        run: |
          python -m unittest -v test_serial_protocol.py
          python -m py_compile serial_protocol.py config_tool.py test_hardware.py
      - name: Run host tests
        run: pio test -e native
      - name: Build Pico W firmware
        run: pio run -e pico_w
