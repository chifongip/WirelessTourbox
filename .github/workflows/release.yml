name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev libxxf86vm-dev

      - name: Build
        working-directory: gui
        run: CGO_ENABLED=1 go build -o wireless-tourbox-config .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: gui/wireless-tourbox-config

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-mingw-w64-x86-64

      - name: Build
        working-directory: gui
        run: CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags "-H windowsgui" -o wireless-tourbox-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: gui/wireless-tourbox-config.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            output: wireless-tourbox-config-mac
          - arch: arm64
            output: wireless-tourbox-config-mac-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: gui
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: go build -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: gui/${{ matrix.output }}

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/wireless-tourbox-config
            artifacts/windows/wireless-tourbox-config.exe
            artifacts/macos-amd64/wireless-tourbox-config-mac
            artifacts/macos-arm64/wireless-tourbox-config-mac-arm64
          generate_release_notes: true
